<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CESPAL V4 Corregido</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><style>body{background:#f4f6f9;font-family:Segoe UI}.header{background:#005b2e;color:#fff;padding:20px}.card-kpi{border-radius:12px}.kpi{font-size:2rem;font-weight:bold}</style></head><body><div class="header"><h1>Dashboard Ejecutivo CESPAL V4</h1><p>Versión corregida</p></div><div class="container mt-4"><div class="row g-3"><div class="col-md-5"><input id="excelOT" type="file" class="form-control" accept=".xlsx,.xls"></div><div class="col-md-5"><input id="excelMateriales" type="file" class="form-control" accept=".xlsx,.xls"></div><div class="col-md-2"><button class="btn btn-success w-100" onclick="procesarArchivos()">Procesar</button></div></div><div id="loader" class="alert alert-info mt-3" style="display:none">Procesando...</div><div class="row mt-3"><div class="col"><div class="card"><div class="card-body text-center"><div>Registros</div><div id="kpiOT" class="kpi">0</div></div></div></div></div><div class="row mt-3"><div class="col-md-6"><canvas id="chartClientes"></canvas></div><div class="col-md-6"><table class="table" id="tablaDatos"><thead><tr><th>OT</th><th>Dato</th></tr></thead><tbody id="tbodyDatos"></tbody></table></div></div></div><script>let chart;function leerArchivoExcel(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];resolve(XLSX.utils.sheet_to_json(sh,{header:1}));};r.onerror=reject;r.readAsArrayBuffer(file);});}async function procesarArchivos(){const ot=document.getElementById('excelOT').files[0];const mat=document.getElementById('excelMateriales').files[0];if(!ot||!mat){alert('Seleccione ambos archivos');return;}document.getElementById('loader').style.display='block';const a=await leerArchivoExcel(ot);const b=await leerArchivoExcel(mat);document.getElementById('kpiOT').innerText=(a.length+b.length);const tb=document.getElementById('tbodyDatos');tb.innerHTML='';a.slice(0,20).forEach((r,i)=>{tb.innerHTML+=`<tr><td>${i+1}</td><td>${JSON.stringify(r).slice(0,80)}</td></tr>`});if(chart)chart.destroy();chart=new Chart(document.getElementById('chartClientes'),{type:'bar',data:{labels:['OT','Materiales'],datasets:[{data:[a.length,b.length]}]}});document.getElementById('loader').style.display='none';}</script></body></html>
